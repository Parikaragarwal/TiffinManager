[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiffin"
version = "0.2.0"
description = "Personal Tiffin & Meal Management CLI"
authors = [{ name = "Parikar" }]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
requires-python = ">=3.10"

[project.scripts]
tiffin = "tiffin.cli:app"
